name: release

# Publishes to npm when a GitHub release is published, through npm trusted publishing (OIDC): the repository holds
# no npm token, and npm adds a provenance statement. Actions are pinned to commit SHAs because this workflow publishes.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never restore a cache into a release build
      - name: Check that the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the package version $version. Set version in package.json first."
            exit 1
          fi
      - run: npm test
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      # Trusted publishing adds provenance on its own; --provenance makes the publish fail instead of shipping without it.
      - run: npm publish --provenance --access public
